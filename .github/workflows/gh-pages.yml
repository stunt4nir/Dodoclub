name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static web export
        env:
          # Permanent backend URL — keep in sync with frontend/.env
          EXPO_PUBLIC_BACKEND_URL: https://dodo-roster-build.emergent.host
        run: npx expo export -p web

      - name: Add GitHub Pages SPA fallback files
        run: |
          # .nojekyll — stop GitHub from stripping _expo/* underscore folder
          touch dist/.nojekyll
          # 404.html → SPA redirect
          cat > dist/404.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"/><title>Club Dodo</title>
          <script>
            var l = window.location;
            l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
              (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
          </script></head><body></body></html>
          HTML
          # Inject decoder into index.html
          python3 - <<'PY'
          html = open('dist/index.html').read()
          snippet = '''<script>
            (function(l){
              if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function(s){
                  return s.replace(/~and~/g,'&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
              }
            }(window.location));
          </script>'''
          if 'spa-github-pages' not in html:
              html = html.replace('<head>', '<head>\n' + snippet, 1)
              open('dist/index.html', 'w').write(html)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
